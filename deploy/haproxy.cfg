# vpnstack haproxy yapılandırması — deploy/haproxy.cfg
#
# Bu dosya kurulumda /etc/haproxy/haproxy.cfg olarak kopyalanır (dosya yoksa).
# Yeni bir REALITY düğümü eklerken reality_frontend bölümüne
#   use_backend re_<ad>_backend if { req.ssl_sni -i <sni> }
# satırı ve ilgili backend eklenmelidir. Ayrıntı: docs/OPERATIONS.md

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 8192
    tune.ssl.default-dh-param 2048

defaults
    mode    tcp
    log     global
    option  tcplog
    timeout connect 10s
    timeout client  1m
    timeout server  1m
    timeout tunnel  1h

# ---------------------------------------------------------------- SSH / WebSocket
# Frontend saf TCP'dir: sshproxy ham başlıklara (X-Real-Host, X-Split) ihtiyaç
# duyar, bu yüzden istek HTTP olarak ayrıştırılmaz. İlk baytlara bakılarak
# WebSocket (GET / CONNECT) ile ham SSH (SSH-2.0-...) ayrılır.
frontend http_frontend
    mode tcp
    bind *:80
    bind *:8080
    tcp-request inspect-delay 5s
    tcp-request content accept if HTTP
    acl is_ws_get req.payload(0,3) -m str GET
    acl is_ws_connect req.payload(0,7) -m str CONNECT
    use_backend ws_backend if is_ws_get or is_ws_connect
    default_backend dropbear_backend

backend ws_backend
    mode tcp
    server ws1 127.0.0.1:10015

backend dropbear_backend
    mode tcp
    server dropbear 127.0.0.1:143

# ---------------------------------------------------------------- REALITY (SNI passthrough)
frontend reality_frontend
    mode tcp
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend re_whatsapp_backend    if { req.ssl_sni -i whatsapp.net }
    use_backend re_speedtest_backend   if { req.ssl_sni -i speedtest.net }
    use_backend re_chatgpt_backend     if { req.ssl_sni -i chatgpt.com }
    use_backend re_youtube_backend     if { req.ssl_sni -i m.youtube.com }
    use_backend re_instagram_backend   if { req.ssl_sni -i i.instagram.com }
    default_backend re_whatsapp_backend

backend re_whatsapp_backend
    mode tcp
    server reality1 127.0.0.1:1443

backend re_speedtest_backend
    mode tcp
    server reality2 127.0.0.1:1444

backend re_chatgpt_backend
    mode tcp
    server reality3 127.0.0.1:1445

backend re_youtube_backend
    mode tcp
    server reality4 127.0.0.1:1446

backend re_instagram_backend
    mode tcp
    server reality5 127.0.0.1:1447
